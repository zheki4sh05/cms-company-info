services:
  cms-company-info:
    build:
      context: .
      dockerfile: Dockerfile
    image: cms-company-info:latest
    container_name: cms-company-info
    restart: unless-stopped
    ports:
      - "${PORT:-9092}:${PORT:-9092}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-9092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
